services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: exchange, POSTGRES_PASSWORD: exchange, POSTGRES_DB: exchange }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
    environment: { MP_SMTP_AUTH_ACCEPT_ANY: 1, MP_SMTP_AUTH_ALLOW_INSECURE: 1 }
  api:
    build: .
    image: tulip-jobs
    command: ["node", "dist/api.js"]
    environment: &env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/exchange
      REDIS_HOST: redis
      SMTP_URL: smtp://mailpit:1025
      DRUMBEATS_PROJECT_ID: ${DRUMBEATS_PROJECT_ID}
      HOOK_SECRET: ${HOOK_SECRET}
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
  worker:
    image: tulip-jobs
    command: ["node", "dist/worker.js"]
    environment: *env
    depends_on: [postgres, redis, mailpit]
  relay:
    image: tulip-jobs
    command: ["node", "dist/relay.js"]
    environment: *env
    depends_on: [postgres, redis]
